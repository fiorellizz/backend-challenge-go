name: wager-service

# Tres instancias da aplicacao rodando os mesmos papeis (api + consumer +
# outbox). E assim que os requisitos de multiplas instancias sao demonstrados:
# disputa de outbox entre publishers, consumo concorrente de SQS e HTTP
# atingindo a mesma carteira a partir de processos independentes.

x-app-env: &app-env
  LOG_LEVEL: info
  LOG_FORMAT: json

  DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
  DATABASE_MAX_CONNS: "10"

  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566

  SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
  SQS_MAX_MESSAGES: "10"
  SQS_WAIT_TIME_SECONDS: "10"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "30"

  # Issuer esperado nos tokens (ver KC_HOSTNAME) e endereco interno para
  # discovery e JWKS.
  OIDC_ISSUER_URL: http://localhost:8080/realms/wager
  OIDC_DISCOVERY_URL: http://keycloak:8080/realms/wager
  OIDC_AUDIENCE: wager-api
  OIDC_INTERNAL_ROLE: internal-service
  OIDC_PROVIDER_ROLE: provider
  OIDC_PROVIDER_CLAIM: provider_id

  OUTBOX_BATCH_SIZE: "20"
  OUTBOX_POLL_INTERVAL: 500ms
  OUTBOX_MAX_ATTEMPTS: "10"

  REFERENCE_POLL_INTERVAL: 1s
  REFERENCE_MAX_ATTEMPTS: "8"
  REFERENCE_BASE_BACKOFF: 2s
  REFERENCE_TTL: 5m

  SHUTDOWN_TIMEOUT: 20s

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    # 5433 no host evita conflito com um PostgreSQL local em 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Aumenta o teto de conexoes: 3 instancias x pool + testes de integracao.
    command: ["postgres", "-c", "max_connections=200"]

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      # A fila principal so existe depois do init hook rodar, entao esperar por
      # ela e o sinal correto de "pronto para uso".
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # O issuer dos tokens e sempre http://localhost:8080/realms/wager, seja
      # o token pedido do host (testes, curl) ou de dentro da rede. Com o
      # backchannel dinamico, o discovery consultado via keycloak:8080 devolve
      # o JWKS em keycloak:8080, alcancavel pelas instancias da aplicacao.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://wager:wager@postgres:5432/wager?sslmode=disable"
      - "up"
    restart: on-failure

  app-1:
    <<: *app-base
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app-1
      APP_ROLES: api,consumer,outbox
      HTTP_ADDR: ":8080"
    ports:
      - "8081:8080"

  app-2:
    <<: *app-base
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app-2
      APP_ROLES: api,consumer,outbox
      HTTP_ADDR: ":8080"
    ports:
      - "8082:8080"

  app-3:
    <<: *app-base
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app-3
      APP_ROLES: api,consumer,outbox
      HTTP_ADDR: ":8080"
    ports:
      - "8083:8080"

volumes:
  postgres-data:
