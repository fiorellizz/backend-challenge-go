name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: fmt, vet, unit, race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet (every build tag)
        run: |
          go vet ./...
          go vet -tags=integration ./...
          go vet -tags=evidence ./test/evidence/
      - name: unit tests
        run: go test ./... -count=1
      - name: race detector
        run: go test -race ./... -count=1

  integration:
    name: integration (postgres, localstack, keycloak)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # --wait returns only after every healthcheck passes, so there is no
      # polling loop of our own to get wrong.
      - name: start dependencies
        run: docker compose up -d --wait --wait-timeout 300 postgres localstack keycloak

      # `run --rm` propagates the exit code of the migration tool. Applying,
      # reverting and applying again also proves the pair is reversible.
      - name: migrations up, down, up
        env:
          DB_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
        run: |
          docker compose run --rm migrate
          docker compose run --rm migrate -path=/migrations -database="$DB_URL" down -all
          docker compose run --rm migrate

      # The suite starts the application in process, so the app-* instances
      # stay down (the make target stops them anyway).
      - name: integration tests (race)
        run: make test-integration-race

      - name: dump state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200
